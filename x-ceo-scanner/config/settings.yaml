# ceoscan settings (non-secret). Secrets go in .env - never in this file.
# Every key is optional; omitted keys use the defaults in src/ceoscan/config.py.

x_api:
  # auto   = use the filtered stream if your plan allows it, otherwise poll timelines
  # stream = filtered stream only;  poll = timeline polling only
  mode: auto
  stream:
    heartbeat_timeout_seconds: 30     # X sends a keep-alive every ~20 s; reconnect after 30 s of silence
    backfill_minutes: 0               # 0-5; may need a higher X tier, so off by default
    terminate_stale_connections: true # on "TooManyConnections", end our own stale connection and retry
    credits_depleted_retry_seconds: 300
  poll:
    max_requests_per_15min: 10000     # GET /2/users/:id/tweets app limit (docs.x.com rate limits)
    utilization: 0.8                  # stay at 80% of the limit
    min_interval_seconds: 2.0
    concurrency: 4
    max_results: 10
  recovery:
    enabled: true                     # after a stream outage, fetch missed posts per account (since_id)
    min_gap_seconds: 20
    max_results: 20
    max_pages: 5                      # follow pagination during catch-up
    max_age_seconds: 3600             # never catch up on posts older than 1 hour
    on_startup: true                  # catch up once after each (re)start, e.g. deploys
  rules:
    max_rules: 1000                   # pay-per-use filtered stream limits
    max_rule_length: 1024
    tag_prefix: ceoscan
    manage_foreign_rules: false       # true = delete stream rules this app did not create
  pricing:                            # docs.x.com/x-api/getting-started/pricing, checked 2026-11-19
    post_read: 0.005
    user_read: 0.010
    monthly_post_cap: 3000000
    checked: "2026-11-19"

scoring:
  model: claude-haiku-5-5
  effort: low                         # low = fastest; raise to medium if scores look shallow
  thinking: adaptive                  # adaptive | disabled
  threshold: 7                        # alert when impact score >= this
  quiet_hours_threshold: 9            # during quiet hours only these scores alert
  joke_threshold: 9                   # posts Claude marks as joke/meme need this score
  require_my_ticker: true             # score must name at least one ticker from the watchlist
  score_always_alert_unflagged: true
  score_watchlist_unflagged: true     # score every watched-account post (fast rules become hints);
                                      # false = only posts the fast rules flag (saves < $1/month)
  timeout_seconds: 4.0                # per Claude request
  total_budget_seconds: 4.0           # hard cap for all attempts; then fall back to the fast-rules score
  max_retries: 1                      # only for fast failures while budget remains
  fallback_max_impact: 7              # rules-only scores never exceed this (no urgent/SMS/quiet-hours)
  max_tokens: 1024
  enabled: true
  pricing:
    input_per_mtok: 0.10
    output_per_mtok: 0.50

alerts:
  timezone: America/Los_Angeles
  snippet_chars: 200
  push: ntfy                          # ntfy | pushover | both | none
  quiet_hours:
    enabled: true
    start: "22:00"
    end: "06:30"
    always_alert_bypass: false        # true = always-alert accounts ignore quiet hours
  ntfy:
    server: https://ntfy.sh           # or your self-hosted ntfy server
  pushover:
    high_priority_min_score: 9
  sms:
    enabled: false                    # needs TWILIO_* in .env
    min_score: 8
  email:
    enabled: false                    # needs SMTP_* in .env
    min_score: 7
    send_daily_summary: true
    use_ssl: false
  send_timeout_seconds: 5.0
  max_post_age_seconds: 900           # older posts (outage catch-up) alert as low-priority "missed" only

ops:
  health_host: 127.0.0.1             # Docker overrides with CEOSCAN_HEALTH_HOST=0.0.0.0
  health_port: 8080
  db_path: data/ceoscan.db
  log_level: INFO
  stream_down_alert_seconds: 120
  daily_summary:
    enabled: true
    time: "18:00"                     # local time in alerts.timezone
  pipeline_workers: 8
  queue_max: 10000
  config_error_action: exit           # exit (code 2) | wait (stay up; Docker sets CEOSCAN_CONFIG_ERROR_ACTION=wait)
