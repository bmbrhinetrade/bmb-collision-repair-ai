# ceoscan settings (non-secret). Secrets go in .env - never in this file.
# Every key is optional; omitted keys use the defaults in src/ceoscan/config.py.
# The file is checked when ceoscan starts: unknown keys, wrong types, unknown time zones and times
# that are not "HH:MM" (24 h, quoted) stop the start with a message naming the setting.

x_api:
  # auto   = use the filtered stream if your plan allows it, otherwise poll timelines
  # stream = filtered stream only;  poll = timeline polling only
  mode: auto
  stream:
    heartbeat_timeout_seconds: 30     # X sends a keep-alive every ~20 s; reconnect after 30 s of silence
    backfill_minutes: 0               # 0-5; may need a higher X tier, so off by default
    terminate_stale_connections: true # on "TooManyConnections", end our own stale connection and retry
    credits_depleted_retry_seconds: 300
  poll:
    max_requests_per_15min: 10000     # GET /2/users/:id/tweets app limit (docs.x.com rate limits)
    utilization: 0.8                  # stay at 80% of the limit
    min_interval_seconds: 2.0
    concurrency: 4
    max_results: 10
  recovery:
    # After a stream outage (and after each start) read the watched accounts' timelines (since_id)
    # for posts missed in the meantime. Keyword-rule matches cannot be recovered this way.
    enabled: true
    min_gap_seconds: 0                # 0 = catch up after every reconnect (empty requests are free)
    max_results: 20                   # posts per page (5-100)
    max_pages: 5                      # pages per account per catch-up (5 x 20 = up to 100 posts)
    max_age_seconds: 3600             # never catch up on posts older than 1 hour
    on_startup: true                  # catch up once after each (re)start, e.g. deploys
  rules:
    max_rules: 1000                   # pay-per-use filtered stream limits
    max_rule_length: 1024
    tag_prefix: ceoscan
    manage_foreign_rules: false       # true = delete stream rules this app did not create
  pricing:                            # docs.x.com/x-api/getting-started/pricing, checked 2026-11-19
    post_read: 0.005
    user_read: 0.010
    counts_request: 0.005             # GET /2/tweets/counts/recent, per request (`python -m ceoscan counts`)
    monthly_post_cap: 3000000
    checked: "2026-11-19"

scoring:
  model: claude-haiku-5-5
  effort: low                         # low = fastest; raise to medium if scores look shallow
  thinking: adaptive                  # adaptive | disabled
  threshold: 7                        # alert when impact score >= this
  quiet_hours_threshold: 9            # during quiet hours only these scores alert
  joke_threshold: 9                   # posts Claude marks as joke/meme need this score
  require_my_ticker: true             # score must name at least one ticker from the watchlist
  score_always_alert_unflagged: true
  score_watchlist_unflagged: true     # score every watched-account post (fast rules become hints);
                                      # false = only posts the fast rules flag (saves < $1/month)
  timeout_seconds: 4.0                # per Claude request (it also gets only what is left of the budget)
  total_budget_seconds: 4.0           # hard cap for all attempts; then the rules-only score is used
  max_retries: 1                      # only for fast failures (429/5xx/connection) with >= 1.5 s left;
                                      # never after a timeout
  fallback_max_impact: 7              # rules-only scores never exceed this (no urgent/SMS/quiet-hours)
  max_tokens: 1024
  enabled: true
  pricing:
    input_per_mtok: 0.10
    output_per_mtok: 0.50

alerts:
  timezone: America/Los_Angeles
  snippet_chars: 200
  push: ntfy                          # ntfy | pushover | both | none
  quiet_hours:
    enabled: true
    start: "22:00"
    end: "06:30"
    always_alert_bypass: false        # true = always-alert accounts ignore quiet hours
  ntfy:
    server: https://ntfy.sh           # or your self-hosted ntfy server
  pushover:
    high_priority_min_score: 9
  sms:
    enabled: false                    # needs TWILIO_* in .env
    min_score: 8
  email:
    enabled: false                    # needs SMTP_* in .env
    min_score: 7
    send_daily_summary: true
    use_ssl: false
    timeout_seconds: 20.0             # one SMTP send (connect + STARTTLS + login); never delays the push
  send_timeout_seconds: 5.0           # per push / SMS request
  max_post_age_seconds: 900           # older posts (outage catch-up) alert as low-priority "missed" only

ops:
  health_host: 127.0.0.1              # this machine only; the Docker image sets CEOSCAN_HEALTH_HOST=0.0.0.0
  health_port: 8080
  db_path: data/ceoscan.db
  log_level: INFO
  stream_down_alert_seconds: 120
  daily_summary:
    enabled: true
    time: "18:00"                     # local time in alerts.timezone
  pipeline_workers: 8                 # posts scored / alerted in parallel
  queue_max: 10000
  # On a configuration problem (after one "configuration problem" alert):
  #   exit = exit with code 2 (systemd does not restart it)
  #   wait = stay up idle, /health 503 with state config_error (the Docker image sets
  #          CEOSCAN_CONFIG_ERROR_ACTION=wait so its restart policy cannot loop)
  config_error_action: exit

# Claude analyst desk: a Claude Code scheduled task that analyzes strong alerts (decision support only;
# it never trades). Set up once at claude.ai/code/routines with the prompt in claude/desk_prompt.md, an
# API trigger, and CLAUDE_DESK_FIRE_URL + CLAUDE_DESK_TOKEN in .env (README: "Claude analyst desk").
# Each run uses your Claude subscription; limits: 30 fires/hour per task, 100/hour per account.
claude_desk:
  enabled: false                      # needs CLAUDE_DESK_FIRE_URL and CLAUDE_DESK_TOKEN in .env
  min_score: 8                        # fire for post alerts with a Claude impact score >= this
  include_always_alert: true          # also fire for alerts from always_alert accounts, whatever the score
  include_rules_only: false           # rules-only scores (Claude failed / offline) do not fire by default;
                                      # true = they fire from min(min_score, scoring.fallback_max_impact),
                                      # because rules-only scores are capped at fallback_max_impact (7)
  skip_late: true                     # never fire for late "Missed during outage" catch-up alerts
  batch_window_seconds: 45            # alerts arriving within this window share one fire (one run)
  max_fires_per_hour: 20              # stays below the 30/hour per-task limit; extra alerts roll into the next fire
  daily_review: true                  # one review run per day at ops.daily_summary.time, after the summary
  context_days: 7                     # recent alerts for the same tickers / accounts sent along as context
  max_text_chars: 60000               # fire text limit (the API accepts up to 65,536 characters)
  timeout_seconds: 15                 # one fire request; 5xx / network errors are retried (3 attempts)
  beta: experimental-cc-routine-2026-04-01   # anthropic-beta header ("" = do not send it)
  api_version: "2023-06-01"           # anthropic-version header
  notify_link: false                  # true = extra low-priority push with the analysis session link
  queue_max: 200                      # alerts waiting for the desk (also while held); when full, the
                                      # lowest-scored is dropped and recorded. One fire takes at most 10.

# Claude Duet feed: strong alerts are emailed to the inbox your Claude Duet agent reads (through the Claude
# Gmail connector), and the ceoscan-alert-desk skill tells Duet how to analyze them. Duet has no webhook, so
# email is the way in. Step-by-step setup for non-developers: claude/DUET_SETUP.md. Decision support only;
# nothing trades. The phone push stays the instant alert; Duet checks in every few hours and in its
# morning brief (or right away when you ask it "analyze my latest ceoscan alert").
claude_duet:
  enabled: true                       # needs SMTP_* in .env and DUET_FEED_TO (or ALERT_EMAIL_TO); works even
                                      # while alerts.email.enabled is false (it is its own channel)
  min_score: 8                        # email post alerts with impact >= this (same semantics as claude_desk:
                                      # with include_rules_only, rules-only alerts qualify from
                                      # min(min_score, scoring.fallback_max_impact))
  include_always_alert: true          # also email alerts from always_alert accounts, whatever the score
  include_rules_only: false           # rules-only scores (Claude failed / offline) are not emailed by default
  include_late: true                  # Duet is not real time: late catch-up alerts are still useful
                                      # (marked LATE in the subject)
  batch_window_seconds: 60            # alerts arriving within this window share one email
  max_emails_per_hour: 30             # inbox protection (1-120); overflow rolls into the next email as a
                                      # batch, never silently dropped
  daily_review: true                  # email the day's review at ops.daily_summary.time, after the summary
                                      # (once per local day, remembered across restarts)
  context_days: 7                     # recent alerts for the same tickers / accounts sent along as context
  subject_prefix: "[ceoscan]"         # the skill looks for subjects starting with this - keep them in sync
  max_text_chars: 60000               # one email body (preface + alert data); the longest fields are cut first

# Red flags and false news: early warning when bad news about one of my tickers appears on X, often a day
# before the headlines (short reports, fraud or accounting claims, probes, lawsuits, recalls, downgrades,
# guidance cuts, executive exits, hacks, failed trials). Each alert says how credible the source is:
# OFFICIAL / CREDIBLE / UNVERIFIED / LIKELY FALSE / DENIED - unverified claims can still move a stock, so
# they alert too, clearly labeled. Extra alerts: "spreading" (several different accounts post bad news
# about one ticker within the window), "denied" (a watched company / CEO account denies a recent red
# flag) and "possible hijack" (a watched account posts scam-like content). Bad news is found by the
# watchlist's red-flag keyword rules and sources (config/watchlist.yaml) and by the watched accounts.
# Alerts only: nothing here trades, and an allegation is never presented as fact.
red_flags:
  enabled: true
  min_score: 6                        # red-flag posts about my tickers alert at Claude impact >= this
                                      # (other posts need scoring.threshold)
  alert_unverified: true              # alert unverified bad news too (labeled UNVERIFIED - could be false)
  alert_likely_false: true            # alert likely-false news too (labeled LIKELY FALSE: it can still move a stock)
  spread_window_minutes: 60           # rolling window for the "spreading" alert (1-1440)
  spread_min_authors: 3               # distinct authors posting red flags about one ticker within the window
  spread_cooldown_minutes: 180        # at most one "spreading" alert per ticker per this many minutes
  denial_lookback_hours: 48           # a denial by a watched account links back to red flags this recent
  suspicious_account_age_days: 90     # younger accounts posting bad news count as suspicious
  established_min_followers: 50000    # blue/business-verified with at least this many followers = established
  trusted_min_followers: 1000000      # business/government-verified this big counts as a credible outlet
  trusted_domains:                    # links to these sites are a hint, listed in the alert; they never make the
                                      # author trusted or a claim credible (bare domains, no https://)
    - sec.gov
    - justice.gov
    - ftc.gov
    - fda.gov
    - nhtsa.gov
    - federalregister.gov
    - courtlistener.com
    - reuters.com
    - bloomberg.com
    - wsj.com
    - ft.com
    - cnbc.com
    - apnews.com
    - nytimes.com
    - barrons.com
    - marketwatch.com
    - businesswire.com
    - prnewswire.com
    - globenewswire.com
