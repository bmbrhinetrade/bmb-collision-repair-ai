# Handle-less keyword rules: posts from accounts with at least min_followers that mention any
# of the tickers (as $CASHTAGS) or terms (words, or "exact phrases" when they contain spaces).
keyword_rules:
  - name: big-account-cashtags
    tickers: all                     # "all" = every ticker above; or a list like [TSLA, NVDA]
    min_followers: 1000000
    extra_operators: "-is:retweet -is:reply lang:en"
    est_posts_per_day: 100              # raised from 60 when 20 more (popular) tickers were added
  # Small-cap biotech: news comes from biotech/FDA trackers and trade press with 1K-100K followers
  # (fda_tracker, FierceBiotech, Endpoints, HME News, Boston Business Journal...). Every term is unique
  # to Apnimed; generic words (OSA, sleep apnea, atomoxetine) are left out on purpose. Expect spikes
  # on catalyst days (lock-up ~Jan 27, PDUFA ~Feb 26-28 2027).
  - name: apmd-catalysts
    tickers: [APMD]
    terms: [Apnimed, Oxnimbi, AD109, aroxybutynin, LunAIRo, SynAIRgy]
    min_followers: 1000
    extra_operators: "-is:retweet -is:reply lang:en"
    est_posts_per_day: 6
  # Talen Energy has no active X account; catch news from mid-size accounts instead. "Talen Energy"
  # is an exact phrase because Talen alone is also a surname.
  - name: tln-news
    tickers: [TLN]
    terms: ["Talen Energy"]
    min_followers: 20000
    extra_operators: "-is:retweet -is:reply lang:en"
    est_posts_per_day: 8

# Company names / product words the fast rules treat like a ticker mention. Matching ignores case,
# except: an alias written with a leading "=" (e.g. "=Gaudi") matches only with that exact case, and
# common words are exact-case automatically (Strategy, Base, Meta, Instinct, Llama, Optimus, Rubin, Gemini,
# Copilot, Azure, Intel, Alphabet; Strategy and Base also never match as a sentence's first word).
# These are only hints for Claude, which reads the post itself.
